<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Jet Emulator</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ring: rgba(255,255,255,0.145); --muted: #999; --blue: #52a8ff; --pad: clamp(20px, 4vw, 56px); }
  html, body { margin: 0; background: #000; color: #ededed; font-family: system-ui, sans-serif; }
  .hero { position: relative; height: 100svh; min-height: 620px; overflow: hidden; cursor: crosshair; touch-action: manipulation; }
  #jet { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero-caption { position: absolute; right: var(--pad); bottom: 28px; z-index: 3; font-size: 12px; color: var(--muted);
    font-family: "Geist Mono", ui-monospace, monospace; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; text-align: right; }
  .new-event { display: inline-flex; align-items: center; gap: 8px; font-family: inherit; font-size: 13px; color: #ededed;
    background: rgba(10,10,10,0.8); backdrop-filter: blur(6px); border: 0; border-radius: 100px; padding: 8px 14px;
    box-shadow: 0 0 0 1px var(--ring); cursor: pointer; transition: box-shadow .15s; }
  .new-event svg { width: 13px; height: 13px; color: var(--blue); transition: transform .4s; }
  .new-event:hover { box-shadow: 0 0 0 1px var(--blue); }
  .new-event:active svg { transform: rotate(90deg) scale(1.2); }
</style>
</head>
<body>
<section class="hero">
  <canvas id="jet" aria-hidden="true"></canvas>
  <div class="hero-caption">
    <button type="button" class="new-event" id="new-event"><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="1.6" fill="currentColor"/><path d="M6 1v2M6 9v2M1 6h2M9 6h2M2.5 2.5l1.4 1.4M8.1 8.1l1.4 1.4M2.5 9.5l1.4-1.4M8.1 3.9l1.4-1.4" stroke="currentColor" stroke-width="1.2"/></svg>New collision</button>
    <span><span style="color:#ededed">━ tracks</span> curve in the magnetic field · <span style="color:#52a8ff">▮ calorimeter</span> energy · <span style="color:#62c073">━ muon</span> · tap the detector</span>
  </div>
</section>
<script src="jet_emulator.js"></script>
</body>
</html>
