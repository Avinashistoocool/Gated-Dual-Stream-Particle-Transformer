site_name: GDS-ParT
site_description: "GDS-ParT by Avinash Chandra Gupta: gated dual-stream particle transformer for jet tagging on JetClass."
site_url: https://avinashistoocool.github.io/Gated-Dual-Stream-Particle-Transformer/
site_author: Avinash Chandra Gupta
copyright: \"&copy; 2026 Avinash Chandra Gupta (Avinash Gupta) &middot; <a href='https://avinashistoocool.github.io/'>avinashistoocool.github.io</a>\"
repo_url: https://github.com/Avinashistoocool/Gated-Dual-Stream-Particle-Transformer
repo_name: Avinashistoocool/Gated-Dual-Stream-Particle-Transformer
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
exclude_docs: |
  *.tex
  build/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle: {icon: material/brightness-4, name: Light mode}
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle: {icon: material/brightness-7, name: Dark mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Setup and training guide: guide.md
  - GDS vs ParT (interactive): gds_vs_part.html
  - Technical report (PDF): GDS-ParT_Technical_Report.pdf

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://avinashistoocool.github.io/
      name: Avinash Chandra Gupta
    - icon: fontawesome/brands/github
      link: https://github.com/Avinashistoocool
      name: Avinash Chandra Gupta on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/avinashistoocool
      name: Avinash Chandra Gupta on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/suprcoolavinash
      name: Avinash Chandra Gupta on X
